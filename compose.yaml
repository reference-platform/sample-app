services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: api
    environment:
      DATABASE_URL: postgresql://sample:sample@db:5432/sample
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:8080"
