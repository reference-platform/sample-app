services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: sample
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build: db
    environment:
      DATABASE_URL: postgres://sample:sample@db:5432/sample?sslmode=disable
    depends_on:
      - db

  api:
    build: api
    environment:
      DATABASE_URL: postgresql://sample:sample@db:5432/sample
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:8080"
