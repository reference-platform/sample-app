name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install the dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check the formatting
        run: ruff format --check .
      - name: Run the tests
        run: python -m pytest

  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [web, worker]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache: false
      - name: Check the formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Run the tests
        run: go test -race ./...

  images:
    name: images (${{ matrix.service }})
    needs: [api, go]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sample-app-${{ matrix.service }}
    strategy:
      matrix:
        include:
          - { service: api, context: api }
          - { service: web, context: web }
          - { service: worker, context: worker }
          - { service: migrate, context: db }
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
      - name: Calculate the next version
        id: version
        if: env.PUBLISH == 'true'
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ${{ matrix.service }}-v
          path_filter: ${{ matrix.context }}
          default_bump: patch
          dry_run: true
      - name: Decide whether to build
        id: plan
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ "$PUBLISH" != "true" ] || [ -n "$VERSION" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        if: steps.plan.outputs.build == 'true' && env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GHCR
        if: steps.plan.outputs.build == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ steps.version.outputs.new_version && format('{0}:{1}', env.IMAGE, steps.version.outputs.new_version) || '' }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Tag the release
        if: env.PUBLISH == 'true' && steps.version.outputs.new_tag != ''
        env:
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
